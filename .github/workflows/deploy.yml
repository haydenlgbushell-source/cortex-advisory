name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        run: |
          npm install -g netlify-cli
          netlify deploy --dir . --prod --site 04832ed4-759c-401f-b1ee-f4a2dedf76bd --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}
